name: RAIN CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # BACKEND
  # ──────────────────────────────────────────────
  backend-test:
    name: Backend · Python tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: rain_app
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: rain_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      valkey:
        image: valkey/valkey:9.0-alpine          # ← Valkey, not Redis
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libsndfile1 \
            libsndfile1-dev

      - name: Install Python deps
        run: pip install -r backend/requirements.txt

      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://rain_app:testpassword@localhost:5432/rain_test
        run: alembic upgrade head

      - name: Run tests
        working-directory: backend                # ← fixes import root
        env:
          PYTHONPATH: .                           # ← app.* imports resolve
          RAIN_ENV: development
          DATABASE_URL: postgresql+asyncpg://rain_app:testpassword@localhost:5432/rain_test
          VALKEY_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test_secret
          S3_ACCESS_KEY: test
          S3_SECRET_KEY: test
          S3_ENDPOINT_URL: http://localhost:9000  # ← upload tests need this
          RAIN_NORMALIZATION_VALIDATED: "true"    # ← prevents config.py defaulting False
        run: |
          pytest tests/ -v --tb=short \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=70

  # ──────────────────────────────────────────────
  # FRONTEND
  # ──────────────────────────────────────────────
  frontend-build:
    name: Frontend · Node build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build

  # ──────────────────────────────────────────────
  # DSP (C++)
  # ──────────────────────────────────────────────
  dsp-test:
    name: DSP · C++ tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake \
            build-essential \
            pkg-config \
            libfftw3-dev \
            libfftw3-double3

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: rain-dsp/build
          key: dsp-build-${{ runner.os }}-${{ hashFiles('rain-dsp/CMakeLists.txt', 'rain-dsp/src/**') }}
          restore-keys: dsp-build-${{ runner.os }}-

      - name: Configure
        run: |
          cmake -S rain-dsp -B rain-dsp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_AVX2=OFF           # ← runner AVX2 not guaranteed

      - name: Build
        run: cmake --build rain-dsp/build --parallel $(nproc)

      - name: Test
        run: ctest --test-dir rain-dsp/build -V --timeout 120

  # ──────────────────────────────────────────────
  # SUMMARY GATE
  # ──────────────────────────────────────────────
  ci-pass:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, dsp-test]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.backend-test.result }}" != "success" || \
                "${{ needs.frontend-build.result }}" != "success" || \
                "${{ needs.dsp-test.result }}" != "success" ]]; then
            echo "One or more jobs failed."
            exit 1
          fi
          echo "All jobs passed."
